<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>html{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}.home-link{text-decoration:none;display:inline-flex;align-items:center;justify-content:center}</style>
<title>1996 的訊號</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&display=swap">
<style>
/* Layout: one-screen night console — a vintage radio fixed on top, the story panel below. Single dark look by design (it's 11pm in an abandoned room). */
:root{
  --sil:#161c28; --sil2:#262f42;
  --ink:#10141c; --wall:#181e2a; --panel:#1f2635; --line:#33405a;
  --wood:#3b2a1f; --wood-dk:#24180f;
  --paper:#ebe0c6; --paper-ink:#3b2f21;
  --amber:#f2ab4c; --signal:#ff5a4c; --ok:#7fd1a8;
  --text:#e9e4da; --muted:#95a1b7;
  --f-display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ink);color:var(--text);font-family:var(--f-body);font-size:16px;line-height:1.7;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
#app{height:100%;max-width:480px;margin:0 auto;padding-inline:16px;padding-block:10px 14px;display:flex;flex-direction:column;gap:12px}

/* top bar */
.bar{display:flex;align-items:center;gap:8px}
.chap{flex:1;min-width:0;font-size:13px;color:var(--muted);letter-spacing:.08em}
.chap b{color:var(--text);font-weight:500}
.clock{font-family:var(--f-mono);font-size:14px;color:var(--amber);padding:2px 8px;border:1px solid var(--line);border-radius:6px}
.icon-btn{background:transparent;border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-size:13px;color:var(--text)}
.icon-btn:disabled{opacity:.35;cursor:default}

/* radio */
.radio{background:linear-gradient(170deg,var(--wood),var(--wood-dk));border-radius:16px;padding:14px;display:grid;gap:10px;box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 10px 30px rgba(0,0,0,.45)}
.dial{position:relative;height:70px;background:var(--paper);border-radius:6px;overflow:hidden;box-shadow:inset 0 0 18px rgba(120,80,20,.35)}
.dial canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.tick{position:absolute;bottom:0;width:1px;background:var(--paper-ink);opacity:.55}
.tick.lab{opacity:.9}
.tick span{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);font-family:var(--f-mono);font-size:10px;color:var(--paper-ink)}
.dial .fm{position:absolute;top:5px;left:8px;font-family:var(--f-mono);font-size:10px;color:var(--paper-ink);letter-spacing:.1em}
.needle{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--signal);box-shadow:0 0 6px var(--signal);transition:left .15s}
.readout{display:flex;align-items:center;gap:12px}
.freq{font-family:var(--f-mono);font-weight:600;font-size:22px;color:var(--amber);font-variant-numeric:tabular-nums;text-shadow:0 0 10px rgba(242,171,76,.45)}
.freq small{font-size:11px;opacity:.7;margin-left:4px}
.meter{display:flex;gap:3px;align-items:flex-end;height:18px;flex:1}
.meter i{display:block;width:6px;border-radius:1px;background:rgba(255,255,255,.12)}
.meter i.on{background:var(--ok)}
.lamp{width:16px;height:16px;border-radius:50%;background:#4a2421;box-shadow:inset 0 1px 2px rgba(0,0,0,.6);transition:background .05s,box-shadow .05s}
.lamp.on{background:var(--signal);box-shadow:0 0 14px 4px rgba(255,90,76,.75)}
.lamp-label{font-size:11px;color:#c9b39a;letter-spacing:.1em}

/* stage */
.stage{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
.dialog{margin-top:auto;cursor:pointer;min-height:132px;display:flex;flex-direction:column;gap:6px}
.who{font-size:12px;letter-spacing:.12em;color:var(--muted)}
.who.xy{color:var(--amber)}
.who.me{color:var(--ok)}
.line{font-size:17px;min-height:2.6em}
.line.narr{color:#c7cbd6}
.line.xy{font-family:var(--f-display);font-weight:600;color:#fbe9cf}
.line.ev{font-size:15px}
.ev-tag{display:inline-block;background:var(--paper);color:var(--paper-ink);border-radius:4px;padding:2px 10px;font-weight:500;transform:rotate(-1deg)}
.cont{align-self:flex-end;font-size:12px;color:var(--muted)}
.choices{display:grid;gap:8px;margin-top:4px}
.choice{text-align:left;background:var(--wall);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.choice:hover{border-color:var(--amber)}

/* puzzles */
.ptitle{font-family:var(--f-display);font-weight:900;font-size:20px;margin:0}
.pdesc{color:#c7cbd6;margin:4px 0 0;font-size:15px}
.tuner{display:grid;gap:10px;margin-top:12px}
.tuner input[type=range]{width:100%;accent-color:var(--amber);height:32px}
.fine{display:flex;gap:8px}
.fine button{flex:1;background:var(--wall);border:1px solid var(--line);border-radius:8px;padding:8px;font-family:var(--f-mono)}
.status{font-size:14px;color:var(--muted);min-height:1.6em}
.status.good{color:var(--ok)}
.status.bad{color:var(--signal)}
.label-card{background:var(--paper);color:var(--paper-ink);border-radius:4px;padding:10px 14px;transform:rotate(-1.2deg);font-family:var(--f-display);font-weight:600;box-shadow:0 4px 10px rgba(0,0,0,.35);margin-top:10px;width:fit-content;max-width:100%}
.label-card small{display:block;font-family:var(--f-body);font-weight:400;font-size:11px;opacity:.7}
.btn{background:var(--amber);color:#2a1a08;border:0;border-radius:10px;padding:12px 16px;font-weight:700}
.btn:disabled{opacity:.4;cursor:default}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line);font-weight:500}
.tape{font-family:var(--f-mono);font-size:18px;letter-spacing:.06em;background:var(--ink);border:1px dashed var(--line);border-radius:8px;padding:10px 12px;min-height:48px;display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--amber);overflow-wrap:anywhere}
.tape .ph{color:var(--muted);font-family:var(--f-body);font-size:13px;letter-spacing:0}
.chart{display:grid;grid-template-columns:repeat(4,1fr);gap:4px 8px;font-family:var(--f-mono);font-size:13px}
.chart div{display:flex;gap:8px;padding:2px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.chart b{color:var(--text);width:1em}
.chart span{color:var(--muted)}
details summary{cursor:pointer;color:var(--muted);font-size:14px}
.answer{display:flex;gap:8px}
.answer input{flex:1;min-width:0;background:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--text);font-family:var(--f-mono);font-size:18px;letter-spacing:.15em;text-transform:uppercase}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}

/* overlays */
.sheet{position:fixed;inset:0;background:rgba(5,8,12,.7);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet>div{width:100%;max-width:480px;max-height:80%;overflow:auto;background:var(--panel);border-top:1px solid var(--line);border-radius:16px 16px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.sheet h3{font-family:var(--f-display);margin:0 0 10px;font-size:18px}
.sheet ul{padding-left:0;list-style:none;margin:0;display:grid;gap:8px}
.sheet li{background:var(--wall);border-radius:8px;padding:10px 12px;font-size:15px}
.hint-locked{color:var(--muted)}

.title{position:fixed;inset:0;z-index:5;background:radial-gradient(ellipse at 50% 30%,#2a2216 0%,var(--ink) 60%);display:flex;align-items:center;justify-content:center;padding-inline:24px}
.title-inner{max-width:420px;display:grid;gap:14px}
.title h1{font-family:var(--f-display);font-weight:900;font-size:clamp(44px,13vw,64px);line-height:1.05;margin:0;color:var(--paper);text-wrap:balance}
.title h1 em{font-style:normal;font-family:var(--f-mono);color:var(--amber);display:block;font-size:.9em;letter-spacing:.04em;text-shadow:0 0 18px rgba(242,171,76,.5)}
.title p{color:#c7cbd6;margin:0}
.title .meta{font-size:12px;letter-spacing:.14em;color:var(--muted)}
.title .row{margin-top:8px}

.endcard h2{font-family:var(--f-display);font-weight:900;font-size:26px;margin:0 0 6px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.stats div{background:var(--wall);border-radius:8px;padding:10px;text-align:center}
.stats b{display:block;font-family:var(--f-mono);font-size:22px;color:var(--amber)}
.stats span{font-size:12px;color:var(--muted)}
.next{border-top:1px dashed var(--line);margin-top:12px;padding-top:12px;color:#c7cbd6;font-size:15px}
/* ch2 puzzles */
.poster{margin-top:14px;background:#d9d2bf;color:#2d2a24;border-radius:3px;padding:12px 14px;box-shadow:0 4px 12px rgba(0,0,0,.35)}
.poster-h{font-family:var(--f-display);font-weight:900;font-size:16px;text-align:center;letter-spacing:.2em;border-bottom:1px solid rgba(0,0,0,.25);padding-bottom:6px;margin-bottom:6px}
.poster ol{list-style:none;margin:0;padding:0;display:grid;gap:2px;font-size:15px}
.poster li{display:flex;gap:10px}
.poster li span{font-family:var(--f-mono);width:1.2em;text-align:right;opacity:.7}
.wheels{display:flex;gap:10px;justify-content:center;margin:16px 0 10px}
.wheel{display:flex;flex-direction:column;align-items:center;background:var(--ink);border:1px solid var(--line);border-radius:10px;width:56px}
.wheel button{background:transparent;border:0;width:100%;padding:8px 0;color:var(--muted);font-size:14px}
.wheel b{font-family:var(--f-mono);font-size:28px;color:var(--amber);font-variant-numeric:tabular-nums;line-height:1.2}
.shelf{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}
.book{display:flex;flex-direction:column;gap:2px;text-align:left;background:linear-gradient(90deg,#2b3446,var(--wall));border:1px solid var(--line);border-left:5px solid #6b4a32;border-radius:4px;padding:10px 10px 10px 12px;min-width:0}
.book .cn{font-family:var(--f-mono);font-size:13px;color:var(--amber)}
.book .bt{font-family:var(--f-display);font-weight:600;font-size:15px;line-height:1.35}
.book .ba{font-size:12px;color:var(--muted)}
.book.wrong{opacity:.35}
.book.picked{border-color:var(--ok);border-left-color:var(--ok)}
.tabs{display:flex;gap:6px;margin-top:14px}
.tabs button{flex:1;background:var(--wall);border:1px solid var(--line);border-radius:8px 8px 0 0;padding:6px;font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.tabs button[aria-selected=true]{background:var(--paper);color:var(--paper-ink);border-color:var(--paper)}
.page{background:var(--paper);color:var(--paper-ink);border-radius:0 0 6px 6px;padding:12px 14px;font-family:var(--f-display);overflow-x:auto}
.pno{text-align:center;font-size:12px;opacity:.6;margin-bottom:6px;font-family:var(--f-body)}
.pl{display:flex;gap:10px;align-items:baseline}
.pl span{font-family:var(--f-mono);font-size:11px;opacity:.55;width:1em;flex:none}
.pl p{margin:0;font-size:16px;letter-spacing:.18em;line-height:2}
/* ch3 puzzles */
.seatwrap{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:12px}
.cap{font-size:12px;color:var(--muted);letter-spacing:.06em;margin-bottom:6px}
.seatgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;border-top:4px solid #3c5446;padding-top:6px}
.sc{aspect-ratio:1.2;max-width:100%;display:flex;align-items:center;justify-content:center;background:var(--paper);color:var(--paper-ink);font-family:var(--f-mono);font-size:12px;border-radius:2px}
.sc.torn{background:transparent;border:1px dashed var(--line)}
.desk{aspect-ratio:1.2;max-width:100%;background:#4a3a2a;border:1px solid #6b5440;border-radius:3px;padding:0}
.desk:hover{border-color:var(--amber)}
.desk.wrong{opacity:.3}
.desk.picked{background:var(--ok);border-color:var(--ok)}
.legend{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:6px}
.wheelbox{margin-top:14px;background:var(--ink);border:1px solid var(--line);border-radius:10px;padding:12px}
.kval{font-family:var(--f-mono);font-size:20px;color:var(--amber);min-width:2ch;text-align:center}
.rings{overflow-x:auto;margin-top:8px}
.ring{display:grid;grid-template-columns:repeat(26,minmax(18px,1fr));font-family:var(--f-mono);font-size:14px;text-align:center;min-width:480px}
.ring span{padding:4px 0}
.ring.bot span{color:var(--amber);border-top:1px solid var(--line)}
.pairs{display:grid;grid-template-columns:repeat(13,minmax(0,1fr));gap:4px;margin-top:10px}
.pr{display:flex;flex-direction:column;align-items:center;background:var(--wall);border-radius:4px;padding:3px 0;font-family:var(--f-mono);font-size:15px;line-height:1.5;min-width:0}
.pr b{width:100%;text-align:center;font-weight:500;color:var(--amber);border-top:1px solid var(--line)}
.strips{display:grid;gap:8px;margin-top:12px}
.strip{display:flex;align-items:center;gap:8px;background:var(--paper);color:var(--paper-ink);border-radius:2px;padding:8px 10px;clip-path:polygon(0 4%,3% 0,30% 6%,60% 0,100% 5%,98% 100%,70% 94%,35% 100%,0 96%)}
.strip p{flex:1;min-width:0;margin:0;font-family:var(--f-display);font-size:15px;line-height:1.5}
.strip mark{background:var(--amber);color:#2a1a08;padding:0 2px;border-radius:2px}
.mv{display:flex;flex-direction:column}
.mv button{background:transparent;border:0;color:var(--paper-ink);padding:2px 6px;font-size:12px}
.mv button:disabled{opacity:.25}
/* ch4–5 */
.who.mom{color:#e9a6b8}
.line.mom{color:#f3dfe5}
.clockface{display:block;width:min(220px,100%);margin:14px auto 10px}
.cf-bg{fill:var(--paper);stroke:#6b4a32;stroke-width:6}
.cf-tick line{stroke:var(--paper-ink);stroke-width:1.2}
.cf-num text{font-family:var(--f-display);font-size:15px;font-weight:600;fill:var(--paper-ink);text-anchor:middle}
.cf-h{stroke:var(--paper-ink);stroke-width:6;stroke-linecap:round}
.cf-m{stroke:var(--signal);stroke-width:3;stroke-linecap:round}
.cf-pin{fill:var(--paper-ink)}
.pick{display:grid;gap:6px}
.pk{display:grid;gap:2px;text-align:left;background:var(--wall);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.pk b{font-size:14px;color:var(--amber);font-weight:500}
.pk span{font-size:15px;line-height:1.5}
.pk.on{border-color:var(--amber);background:#2b2a26}
.fq-q{font-weight:500;margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--wall);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:14px;text-align:left}
.chip.on{border-color:var(--amber);color:var(--amber)}
.finale h2{font-size:34px;color:var(--paper)}
/* scenes & cinematic fx */
.stage-wrap{flex:1;min-height:0;position:relative;display:flex}
.stage-wrap .stage{flex:1;position:relative;z-index:1}
.scene{position:absolute;inset:0;border-radius:14px;overflow:hidden;pointer-events:none;background:linear-gradient(#151b27,#0e1219)}
.scene[data-k=library]{background:linear-gradient(#111a1a,#0d1214)}
.scene[data-k=classroom]{background:linear-gradient(#151c22,#0f1317)}
.scene[data-k=tower]{background:linear-gradient(#0f1220,#0b0d15)}
.scene[data-k=roof]{background:linear-gradient(#0b1224,#1a2236)}
.scene[data-k=home]{background:linear-gradient(#271d15,#130f0b)}
.scene::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(242,171,76,0) 30%,rgba(242,171,76,.28));opacity:0;transition:opacity 4s}
.scene.dawn::after{opacity:1}
#sceneArt{position:absolute;inset:0;animation:sceneIn 1.4s ease}
#sceneArt svg{position:absolute;inset:0;width:100%;height:100%}
#motes{position:absolute;inset:0;width:100%;height:100%}
@keyframes sceneIn{from{opacity:0;transform:scale(1.04)}to{opacity:1;transform:none}}
.s1{fill:var(--sil)} .s2{fill:var(--sil2)} .st{stroke:var(--sil2);fill:none} .moon{fill:var(--paper)} .warm{fill:var(--amber)}
.swing{transform-origin:130px 0;animation:swing 5s ease-in-out infinite alternate}
@keyframes swing{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}
.flick{animation:flick 7s infinite}
@keyframes flick{0%,40%,44%,48%,100%{opacity:.85}42%,46%{opacity:.1}}
.pulse{animation:pulse 3s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.spin{transform-origin:200px 130px;animation:spin 40s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.dialog{background:rgba(26,32,46,.94);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.box{position:relative}
.vignette{position:fixed;inset:0;pointer-events:none;z-index:4;opacity:0;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 45%,rgba(140,8,8,.45) 100%)}
.vignette.beat{animation:beat .45s ease-out}
.vignette.red{animation:beat .9s ease-out}
@keyframes beat{0%{opacity:0}25%{opacity:1}100%{opacity:0}}
.flash{position:fixed;inset:0;pointer-events:none;z-index:6;opacity:0;background:#e8eef7}
.flash.flicker{animation:fl 1.1s steps(1)}
@keyframes fl{0%{opacity:0}8%{opacity:.18}14%{opacity:0}30%{opacity:.12}36%{opacity:0}52%{opacity:.08}58%{opacity:0}}
.flash.cut{background:#7c8496;animation:cut 1.4s ease-out}
@keyframes cut{0%{opacity:.5}10%{opacity:.1}18%{opacity:.4}30%{opacity:0}}
.line.xy.in{animation:sigin .8s ease-out}
@keyframes sigin{0%{opacity:0;text-shadow:3px 0 rgba(255,90,76,.8),-3px 0 rgba(127,209,168,.8)}25%{opacity:1}40%{text-shadow:-2px 0 rgba(255,90,76,.6),2px 0 rgba(127,209,168,.6);opacity:.6}60%{opacity:1}100%{text-shadow:none}}
.ev-tag{animation:evin .7s cubic-bezier(.2,1.4,.4,1)}
@keyframes evin{from{opacity:0;transform:translateY(-24px) rotate(-12deg) scale(1.2)}to{opacity:1;transform:rotate(-1deg)}}
.ping{animation:ping 1.2s ease-out}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(242,171,76,.8)}100%{box-shadow:0 0 0 14px rgba(242,171,76,0)}}
.chapcard{position:fixed;inset:0;z-index:8;background:var(--ink);display:flex;align-items:center;justify-content:center;padding-inline:24px;text-align:center;cursor:pointer;animation:ccIn 3.2s ease forwards}
@keyframes ccIn{0%{opacity:0}15%{opacity:1}80%{opacity:1}100%{opacity:0}}
.cc-k{font-family:var(--f-mono);font-size:13px;letter-spacing:.4em;color:var(--amber);animation:ccTrack 3s ease}
.cc-n{font-family:var(--f-display);font-weight:900;font-size:clamp(40px,12vw,60px);color:var(--paper);margin:8px 0;animation:ccTrack 3s ease}
.cc-s{color:var(--muted);font-size:14px;letter-spacing:.1em}
@keyframes ccTrack{from{letter-spacing:.9em;opacity:0;filter:blur(6px)}40%{opacity:1;filter:none}}
/* jump scare: crow — the overlay ends invisible, so the base state is the calm after */
.who.janitor{color:#8fc7e8}
.crowfx{position:fixed;inset:0;z-index:7;pointer-events:none;overflow:hidden}
.crow-flash{position:absolute;inset:0;background:#000;opacity:0;animation:cflash .5s ease-out}
@keyframes cflash{0%{opacity:.95}40%{opacity:.85}100%{opacity:0}}
.crow{position:absolute;left:50%;top:45%;width:min(90vw,420px);transform:translate(-50%,-50%) scale(3.2) rotate(-8deg);opacity:0;animation:crowfly .9s cubic-bezier(.2,.9,.3,1)}
@keyframes crowfly{0%{transform:translate(-50%,-50%) scale(.15) rotate(20deg);opacity:1}55%{transform:translate(-50%,-50%) scale(1.6) rotate(-6deg);opacity:1}85%{opacity:1}100%{transform:translate(-50%,-50%) scale(3.2) rotate(-8deg);opacity:0}}

/* ---------- dial ---------- */
(function buildDial(){
  const d=$('dial');
  for(let f=88;f<=108;f++){
    const t=document.createElement('div');
    const lab=f%4===0;
    t.className='tick'+(lab?' lab':'');
    t.style.left=pct(f*10)+'%';
    t.style.height=lab?'22px':'12px';
    if(lab){const s=document.createElement('span');s.textContent=f;t.appendChild(s)}
    d.appendChild(t);
  }
  const m=$('meter');
  for(let k=0;k<5;k++){const i=document.createElement('i');i.style.height=(6+k*3)+'px';m.appendChild(i)}
})();
function pct(tenths){return ((tenths-875)/(1080-875))*100*0.92+4}

/* ---------- story engine ---------- */
let typing=null;
function current(){return SCRIPT[S.i]}
function next(){S.i++;save();render()}
function render(){
  let st=current(),newChap=false;
  while(st&&((st.if&&S.ch[st.if[0]]!==st.if[1])||st.t==='chapter')){
    if(st.t==='chapter'){S.chap=st.n;S.chapName=st.name;S.scene=CHAP_SCENE[st.n];newChap=true}
    S.i++;st=current();
  }
  if(newChap)showChapterCard(S.chap,S.chapName);
  if(st&&st.scene)S.scene=st.scene;
  setScene(S.scene||CHAP_SCENE[S.chap]||'radio');
  if(st&&st.clock){S.clock=st.clock}
  if($('clock').textContent!==S.clock){$('clock').textContent=S.clock;fxRestart($('clock'),'ping')}
  $('chap').innerHTML=CH_LABEL[S.chap]+' · <b>'+S.chapName+'</b>';
  if(st&&st.t==='finale')audio.resolve();else{audio.unresolve&&audio.resolved&&audio.unresolve();audio.setMood({1:.55,2:.65,3:.8,4:1,5:.75}[S.chap]||.6)}
  $('btnHint').disabled=!(st&&st.t==='puzzle');
  stage.innerHTML='';
  if(!st)return;
  if(st.t==='say')return renderSay(st);
  if(st.t==='video')return renderVideo(st);
  if(st.t==='ev')return renderEv(st);
  if(st.t==='choice')return renderChoice(st);
  if(st.t==='puzzle')return ({tune:renderTune,morse:renderMorse,lock:renderLock,shelf:renderShelf,cipher:renderCipher,seat:renderSeat,caesar:renderCaesar,strips:renderStrips,clockbox:renderClockbox,liar:renderLiar,final:renderFinal})[st.id]();
  if(st.t==='end')return renderEnd(st);
  if(st.t==='finale')return renderFinale();
  if(st.t==='cut')return renderCut(st);
}

function typeInto(el,text,done){
  if(reduce){if(typing&&typing.cancel)typing.cancel();typing=null;el.textContent=text;done&&done();return}

  if(typing&&typing.cancel)typing.cancel();const me={cancel(){clearInterval(id)},finish(){clearInterval(id);el.textContent=text;if(typing===me)typing=null;done&&done()}};typing=me;

    <div class="status" id="tuneStatus">雜訊很大……</div>
  </div>`;
  stage.appendChild(box);
  const r=$('tuneRange'),stEl=$('tuneStatus');let lockT=null,done=false;

/* ---------- chapter jump ---------- */
function chapterList(){
  const list=[];SCRIPT.forEach((s,i)=>{if(s.t==='chapter')list.push({n:s.n,name:s.name,idx:i})});
  if(!list.find(c=>c.n===1))list.unshift({n:1,name:fresh().chapName,idx:0});
  return list;
}
function simStep(st){
  if(st.t==='chapter'){S.chap=st.n;S.chapName=st.name}
  if(st.clock)S.clock=st.clock;
  if(st.scene)S.scene=st.scene;
  if(st.t==='ev'&&!S.ev.find(e=>e.id===st.id))S.ev.push({id:st.id,name:st.name,text:st.text});
  if(st.t==='choice'){const o=st.options.find(o=>!o.die)||st.options[0];S.ch[st.key]=o.v;S.chText=S.chText||{};S.chText[st.key]=o.text}
  simExtra(st);
}
function jumpTo(n){
  const c=chapterList().find(x=>x.n===n);if(!c)return;
  S=fresh();
  for(let k=0;k<c.idx;k++){const st=SCRIPT[k];if(st.if&&S.ch[st.if[0]]!==st.if[1])continue;simStep(st)}
  S.i=c.idx;save();
  try{audio.init()}catch(e){}
  $('title').hidden=true;$('sheet').hidden=true;
  const sc=document.getElementById('scene');if(sc)sc.classList.remove('dawn');
  if(audio.unresolve)audio.unresolve();
  if(typeof setFreq==='function')setFreq(S.freq);
  render();
  if(SCRIPT[c.idx].t!=='chapter'&&typeof showChapterCard==='function')showChapterCard(S.chap,S.chapName);
}

  const list=chapterList();

  <ul>${list.map(c=>`<li style="padding:0"><button class="chapjump" data-n="${c.n}" style="width:100%;text-align:left;background:transparent;border:0;padding:12px;min-height:48px;display:flex;justify-content:space-between;gap:8px"><span><b>${CH_LABEL[c.n]}</b>　${c.name}</span>${c.n===S.chap&&S.i>0&&$('title').hidden?'<span style="color:var(--muted);font-size:12px">目前</span>':''}</button></li>`).join('')}</ul>
  <div class="row" style="margin-top:14px"><button class="btn ghost" id="chapClose">關閉</button></div>`);
  document.querySelectorAll('.chapjump').forEach(b=>b.onclick=()=>jumpTo(+b.dataset.n));
  $('chapClose').onclick=()=>$('sheet').hidden=true;
}
function simExtra(st){if(st.t==='puzzle'&&st.id==='tune')S.freq=TARGET}

const lab=document.getElementById('chap');if(lab){lab.onclick=cinePick;lab.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();cinePick()}}}
decorate();
new MutationObserver(sched).observe(document.body,{childList:true,subtree:true,characterData:true});
})();

/* ---------- episode deep link (#ch3) + resume audio on first tap ---------- */
(function(){
  const m=/^#ch(\d)$/.exec(location.hash||'');
  if(m&&typeof jumpTo==='function'){setTimeout(()=>{try{jumpTo(+m[1])}catch(e){}try{history.replaceState(null,'',location.pathname)}catch(e){}},60)}
  const wake=()=>{try{if(typeof audio!=='undefined'){if(!audio.ctx&&audio.init)audio.init();if(audio.ctx&&audio.ctx.state==='suspended')audio.ctx.resume()}}catch(e){}};
  document.addEventListener('pointerdown',wake,{capture:true});document.addEventListener('keydown',wake,{capture:true});
})();

</script>
