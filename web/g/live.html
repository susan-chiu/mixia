<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>html{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}.home-link{text-decoration:none;display:inline-flex;align-items:center;justify-content:center}</style>
<title>幽靈直播</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@600;900&display=swap">
<style>
/* Layout: one-screen livestream console — HUD with LIVE badge, viewer count and signal on top, the abandoned park "camera feed" behind the story panel, chat bursts in the panel. Single dark neon look by design. */
:root{
  --ink:#0b0a14; --wall:#16132a; --panel:#1a1630; --line:#352b52;
  --sil:#120f22; --sil2:#231d3a;
  --paper:#eee6d6; --paper-ink:#2a2420;
  --line-color:#ff4fa3; --cyan:#3fe0e8; --amber:#f6c35a; --red:#ff4a5a; --ok:#8fd3a6;
  --text:#ece8f4; --muted:#9a92b4;
  --f-display:"Noto Serif TC","Songti TC",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ink);color:var(--text);font-family:var(--f-body);font-size:16px;line-height:1.7;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--line-color);outline-offset:2px}
#app{height:100%;max-width:480px;margin:0 auto;padding-inline:16px;padding-block:10px 14px;display:flex;flex-direction:column;gap:10px}
.bar{display:flex;align-items:center;gap:8px}
.chap{flex:1;min-width:0;font-size:13px;color:var(--muted);letter-spacing:.08em}
.chap b{color:var(--text);font-weight:500}
.clock{font-family:var(--f-mono);font-size:14px;color:var(--amber);padding:2px 8px;border:1px solid var(--line);border-radius:6px}
.tools{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.icon-btn{background:transparent;border:1px solid var(--line);border-radius:8px;padding:5px 4px;font-size:13px;color:var(--text);min-height:36px}
.icon-btn:disabled{opacity:.35;cursor:default}
.livebar{display:flex;align-items:center;gap:10px;font-family:var(--f-mono);font-size:12px;color:var(--muted);min-height:20px}
.live{display:inline-flex;align-items:center;gap:5px;background:var(--red);color:#fff;font-weight:600;padding:0 7px;border-radius:4px;letter-spacing:.08em}
.live i{width:6px;height:6px;border-radius:50%;background:#fff;animation:lv 1.2s steps(1) infinite}
@keyframes lv{50%{opacity:.2}}
.live.off{background:#3a3550;color:var(--muted)}
.live.off i{animation:none;background:var(--muted)}
.viewers{display:inline-flex;align-items:center;gap:4px;color:var(--text)}
.viewers svg{width:14px;height:14px}
.sig{display:inline-flex;gap:2px;align-items:flex-end;height:12px;margin-left:auto}
.sig i{width:3px;background:rgba(255,255,255,.18);border-radius:1px}
.sig i.on{background:var(--cyan)}

.stage-wrap{flex:1;min-height:0;position:relative;display:flex}
.stage{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:12px;position:relative;z-index:1}
.scene{position:absolute;inset:0;border-radius:14px;overflow:hidden;pointer-events:none;background:linear-gradient(#141128,#0a0914)}
.scene::before{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 3px)}
.camhud{position:absolute;top:10px;left:12px;right:12px;display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:11px;color:rgba(255,255,255,.75);z-index:4;letter-spacing:.1em}
.camhud .rec{color:#ff6070}
.camhud .rec::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#ff4a5a;margin-right:5px;animation:lv 1s steps(1) infinite}
.corner{position:absolute;width:18px;height:18px;border:2px solid rgba(255,255,255,.4);z-index:4}
.corner.a{left:8px;top:28px;border-right:0;border-bottom:0}.corner.b{right:8px;top:28px;border-left:0;border-bottom:0}
#sceneArt{position:absolute;inset:0;animation:sceneIn 1.2s ease}
#sceneArt svg{position:absolute;inset:0;width:100%;height:100%}
#motes{position:absolute;inset:0;width:100%;height:100%}
@keyframes sceneIn{from{opacity:0;transform:scale(1.04)}}
.s1{fill:var(--sil)} .s2{fill:var(--sil2)}
.blinkN{animation:blinkN 1.4s steps(1) infinite}
@keyframes blinkN{50%{opacity:.25}}
.flick{animation:flick 5s infinite}
@keyframes flick{0%,38%,42%,46%,100%{opacity:.9}40%,44%{opacity:.08}}
.spinW{transform-origin:200px 150px;animation:spinW 60s linear infinite}
@keyframes spinW{to{transform:rotate(360deg)}}
.sway{transform-origin:top center;animation:sway 3s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}

.box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;position:relative}
.dialog{margin-top:auto;cursor:pointer;min-height:132px;display:flex;flex-direction:column;gap:6px;background:rgba(24,20,44,.94);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.who{font-size:12px;letter-spacing:.12em;color:var(--muted)}
.who.me{color:var(--ok)} .who.yoru{color:var(--line-color)} .who.xg{color:var(--cyan)} .who.bao{color:var(--amber)} .who.voice{color:var(--red)}
.line{font-size:17px;min-height:2.6em}
.line.narr{color:#ccc6dc}
.cont{align-self:flex-end;font-size:12px;color:var(--muted)}
.choices{display:grid;gap:8px;margin-top:4px}
.choice{text-align:left;background:var(--wall);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.choice:hover{border-color:var(--line-color)}
.timer{height:5px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden}
.timer i{display:block;height:100%;background:var(--red);transform-origin:left;animation:drain linear forwards}
@keyframes drain{from{transform:scaleX(1)}to{transform:scaleX(0)}}
.tag{display:inline-block;background:var(--paper);color:var(--paper-ink);border-radius:4px;padding:2px 10px;font-weight:500;transform:rotate(-1deg);animation:evin .7s cubic-bezier(.2,1.4,.4,1)}
@keyframes evin{from{opacity:0;transform:translateY(-24px) rotate(-12deg) scale(1.2)}}

/* chat burst */
.chat{margin-top:auto;cursor:pointer;display:flex;flex-direction:column;gap:6px;background:rgba(14,12,28,.92);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.chat-h{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);letter-spacing:.1em}
.chat-h b{font-family:var(--f-mono);font-weight:500;color:var(--text)}
.msgs{display:flex;flex-direction:column;gap:5px;min-height:96px}
.msg{display:flex;gap:8px;align-items:flex-start;font-size:15px;line-height:1.45;animation:msgin .3s ease-out}
@keyframes msgin{from{opacity:0;transform:translateY(8px)}}
.msg .av{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;color:#111;margin-top:1px}
.msg .body{min-width:0}
.msg .u{font-weight:700;margin-right:6px;font-size:13px}
.msg .badge{display:inline-block;font-size:10px;padding:0 5px;border-radius:3px;margin-right:4px;vertical-align:1px;font-weight:700}
.msg.host .u{color:var(--line-color)}
.msg.xg .u{color:var(--cyan);text-shadow:0 0 8px rgba(63,224,232,.7)}
.msg.xg .t{color:#d8fbff}
.msg.me .u{color:var(--ok)}
.msg.sys{color:var(--muted);font-size:13px;font-style:italic}
.msg.pin{background:rgba(255,79,163,.12);border:1px solid rgba(255,79,163,.4);border-radius:8px;padding:5px 8px}
.ts{font-family:var(--f-mono);font-size:11px;color:var(--muted);margin-right:6px}

.ptitle{font-family:var(--f-display);font-weight:900;font-size:20px;margin:0}
.pdesc{color:#ccc6dc;margin:4px 0 0;font-size:15px}
.msgx{font-size:14px;color:var(--muted);min-height:1.6em}
.msgx.good{color:var(--ok)} .msgx.bad{color:var(--red)}
.btn{background:var(--line-color);color:#24061a;border:0;border-radius:10px;padding:12px 16px;font-weight:700;min-height:44px}
.btn:disabled{opacity:.4;cursor:default}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line);font-weight:500}
.btn.danger{background:var(--red);color:#fff}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.cap{font-size:12px;color:var(--muted);letter-spacing:.06em;margin-bottom:6px}
.paper{background:var(--paper);color:var(--paper-ink);border-radius:3px;padding:12px 14px;box-shadow:0 8px 20px rgba(0,0,0,.5)}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
.opts{display:grid;gap:6px;margin-top:10px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;background:var(--wall);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:15px;line-height:1.5}
.opt i{flex:none;width:18px;height:18px;border-radius:4px;border:2px solid var(--muted);margin-top:2px}
.opt.on{border-color:var(--line-color);background:#2a1a3a}
.opt.on i{background:var(--line-color);border-color:var(--line-color)}
.opt.round i{border-radius:50%}
.wheels{display:flex;gap:10px;justify-content:center;margin:14px 0 8px}
.wheel{display:flex;flex-direction:column;align-items:center;background:var(--ink);border:1px solid var(--line);border-radius:10px;width:56px}
.wheel button{background:transparent;border:0;width:100%;padding:8px 0;color:var(--muted);font-size:14px;min-height:36px}
.wheel b{font-family:var(--f-mono);font-size:28px;color:var(--amber);font-variant-numeric:tabular-nums;line-height:1.2}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl td,.tbl th{padding:4px 6px;border-bottom:1px solid rgba(0,0,0,.15);text-align:left;vertical-align:top}
.tbl th{font-weight:700}
.tbl .m{font-family:var(--f-mono);white-space:nowrap}
.scroll-x{overflow-x:auto}
.arrows{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:10px}
.arrows button{min-height:52px;border-radius:10px;border:1px solid var(--line);background:var(--wall);font-size:24px}
.seq{font-family:var(--f-mono);font-size:24px;letter-spacing:.3em;min-height:44px;background:var(--ink);border:1px dashed var(--line);border-radius:8px;padding:6px 12px;margin-top:10px;color:var(--cyan)}
.mirrorcard{display:flex;justify-content:center;gap:10px;font-size:28px;padding:10px;background:linear-gradient(135deg,#2a3a4a,#1a2430);border:6px solid #6b7b8a;border-radius:6px;color:#e6f6ff;transform:scaleX(1);margin-top:10px}

/* overlays */
.sheet{position:fixed;inset:0;background:rgba(5,4,10,.75);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet>div{width:100%;max-width:480px;max-height:85%;overflow:auto;background:var(--panel);border-top:1px solid var(--line);border-radius:16px 16px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.sheet h3{font-family:var(--f-display);margin:0 0 10px;font-size:18px}
.sheet ul{padding-left:0;list-style:none;margin:0;display:grid;gap:8px}
.sheet li{background:var(--wall);border-radius:8px;padding:10px 12px;font-size:15px}
.locked{color:var(--muted)}
.title{position:fixed;inset:0;z-index:5;background:radial-gradient(ellipse at 50% 28%,#3a1640 0%,var(--ink) 62%);display:flex;align-items:center;justify-content:center;padding-inline:24px}
.title-inner{max-width:420px;display:grid;gap:14px}
.title h1{font-family:var(--f-display);font-weight:900;font-size:clamp(44px,13vw,64px);line-height:1.1;margin:0;color:var(--paper)}
.title h1 em{font-style:normal;display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:.26em;letter-spacing:.2em;background:var(--red);color:#fff;padding:2px 8px;border-radius:4px;margin-bottom:8px}
.title p{color:#ccc6dc;margin:0}
.title .meta{font-size:12px;letter-spacing:.14em;color:var(--muted)}
.death{position:fixed;inset:0;z-index:9;background:#06050c;display:flex;align-items:center;justify-content:center;padding-inline:24px;animation:dIn 1s steps(6)}
@keyframes dIn{0%{background:#1a1a2a}50%{background:#06050c}}
.death::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.05) 0 1px,transparent 1px 3px);pointer-events:none}
.death-inner{position:relative;max-width:400px;display:grid;gap:14px;text-align:center}
.death .d-k{font-family:var(--f-mono);letter-spacing:.4em;color:var(--red);font-size:13px}
.death h2{font-family:var(--f-display);font-weight:900;font-size:32px;margin:0;color:#f3e6ee;animation:dT 1.4s ease}
@keyframes dT{from{letter-spacing:.6em;opacity:0;filter:blur(8px)}}
.death p{margin:0;color:#cbbccc;font-size:16px}
.death .d-why{font-size:14px;color:var(--paper-ink);background:var(--paper);padding:10px 12px;border-radius:3px}
.death .row{justify-content:center}
.chapcard{position:fixed;inset:0;z-index:8;background:var(--ink);display:flex;align-items:center;justify-content:center;padding-inline:24px;text-align:center;cursor:pointer;animation:ccIn 3.2s ease forwards}
@keyframes ccIn{0%{opacity:0}15%{opacity:1}80%{opacity:1}100%{opacity:0}}
.cc-k{font-family:var(--f-mono);font-size:13px;letter-spacing:.4em;color:var(--line-color);animation:ccT 3s ease}
.cc-n{font-family:var(--f-display);font-weight:900;font-size:clamp(38px,11vw,56px);color:var(--paper);margin:8px 0;animation:ccT 3s ease}
.cc-s{color:var(--muted);font-size:14px;letter-spacing:.1em}
@keyframes ccT{from{letter-spacing:.9em;opacity:0;filter:blur(6px)}40%{opacity:1;filter:none}}
.flash{position:fixed;inset:0;pointer-events:none;z-index:6;opacity:0;background:#e8eef7}
.flash.flicker{animation:fl 1.1s steps(1)}
@keyframes fl{0%{opacity:0}8%{opacity:.18}14%{opacity:0}30%{opacity:.12}36%{opacity:0}}
.flash.static{background:repeating-linear-gradient(0deg,#888 0 2px,#222 2px 4px);animation:st 1s steps(5)}
@keyframes st{0%{opacity:.85}100%{opacity:0}}
.vignette{position:fixed;inset:0;pointer-events:none;z-index:4;opacity:0;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 45%,rgba(255,40,90,.4) 100%)}
.vignette.red{animation:beat .9s ease-out}
@keyframes beat{0%{opacity:0}25%{opacity:1}100%{opacity:0}}
.ping{animation:ping 1.2s ease-out}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(255,79,163,.8)}100%{box-shadow:0 0 0 14px rgba(255,79,163,0)}}
#app.quake{animation:quake .5s}
@keyframes quake{10%,50%,90%{transform:translate(-6px,3px)}30%,70%{transform:translate(6px,-3px)}}
.endcard h2{font-family:var(--f-display);font-weight:900;font-size:28px;margin:0 0 6px;color:var(--paper)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px 0}
.stats div{background:var(--wall);border-radius:8px;padding:10px;text-align:center}
.stats b{display:block;font-family:var(--f-mono);font-size:22px;color:var(--amber)}
.stats span{font-size:12px;color:var(--muted)}
.next{border-top:1px dashed var(--line);margin-top:12px;padding-top:12px;color:#ccc6dc;font-size:15px}

/* cutscenes — base state is the END state */
.cut{position:relative;flex:1;min-height:300px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;cursor:pointer;padding-block:12px}
.cut>.cont{position:absolute;bottom:4px;right:4px}
.cap2{font-family:var(--f-display);font-weight:600;font-size:18px;color:var(--paper);text-align:center;text-shadow:0 2px 12px rgba(0,0,0,.9);animation:fadeUp .9s var(--d,0s) both}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}}
.count{font-family:var(--f-mono);font-size:72px;font-weight:600;color:#fff;text-shadow:0 0 24px var(--line-color)}
.livebig{display:inline-flex;align-items:center;gap:8px;background:var(--red);color:#fff;font-family:var(--f-mono);font-weight:600;font-size:26px;padding:4px 14px;border-radius:6px;letter-spacing:.1em;animation:pop .5s 2.6s cubic-bezier(.3,1.6,.5,1) both}
@keyframes pop{from{transform:scale(2.4);opacity:0}}
.vcount{font-family:var(--f-mono);font-size:16px;color:var(--text);animation:fadeUp .6s 3s both}
.cars{display:flex;gap:6px}
.cars i{width:18px;height:18px;border-radius:50%;background:#2a2440;animation:lightup .3s var(--d) steps(1) both}
@keyframes lightup{from{background:#2a2440;box-shadow:none}to{background:var(--amber);box-shadow:0 0 12px var(--amber)}}
.cars i{background:var(--amber);box-shadow:0 0 12px var(--amber)}
.eyes2{display:flex;gap:18px;animation:eyesIn 2s ease both}
.eyes2 i{width:14px;height:10px;border-radius:50%;background:#e8ff9a;box-shadow:0 0 16px #e8ff9a}
@keyframes eyesIn{0%,30%{opacity:0}40%{opacity:1}100%{opacity:1}}
.critter{width:120px;height:70px;animation:run 1.2s 2.2s ease-in both}
@keyframes run{from{transform:translateX(-160px)}to{transform:translateX(0)}}
.vod{width:min(320px,100%);background:#0c0a18;border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:8px}
.vod .pb{height:4px;background:#2a2440;border-radius:2px;overflow:hidden}
.vod .pb i{display:block;height:100%;width:100%;background:var(--red);transform-origin:left;animation:pbar 3s linear both}
@keyframes pbar{from{transform:scaleX(.3)}}
.vod .late{opacity:1;animation:fadeUp .8s 2.4s both}
.bang{position:fixed;inset:0;z-index:7;pointer-events:none;background:#000;opacity:0;animation:bang .7s var(--d,2s) ease-out both}
@keyframes bang{0%{opacity:.95}20%{opacity:.4;background:#fff}35%{opacity:.9;background:#000}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.cut *,.flick,.blinkN,.spinW,.sway,.tag,.cc-k,.cc-n,#sceneArt,.msg,#app.quake,.death,.death h2{animation:none!important}.vignette,.flash,.bang{display:none}}
.frz{display:grid;justify-items:center;gap:10px;width:100%}
.frz-scr{position:relative;width:min(300px,100%);aspect-ratio:3/2;border:1px solid var(--line);border-radius:8px;overflow:hidden;filter:saturate(.6)}
.frz-scr svg{display:block;width:100%;height:100%}
.frz-fig{opacity:1;animation:figIn 3s .4s steps(6) both}
@keyframes figIn{0%,60%{opacity:0}62%{opacity:.6}66%{opacity:0}75%{opacity:.8}78%{opacity:.1}100%{opacity:1}}
.frz-noise{position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.06) 0 1px,transparent 1px 3px);mix-blend-mode:screen;opacity:.7;animation:nz .2s steps(2) infinite}
@keyframes nz{50%{transform:translateY(2px)}}
.frz-tag{position:absolute;left:8px;top:8px;font-family:var(--f-mono);font-size:11px;color:#fff;background:rgba(0,0,0,.6);padding:1px 6px;border-radius:3px;animation:lv 1s steps(2) infinite}
.frz-v{font-family:var(--f-mono);font-size:14px;color:var(--red)}
.jump{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:#000;pointer-events:none;opacity:0;animation:jmp 1.4s var(--d,5s) both}
.jump svg{position:absolute;left:50%;top:50%;translate:-50% -50%;width:min(120vw,620px);height:auto;animation:jz 1.4s var(--d,5s) cubic-bezier(.2,1.6,.4,1) both}
@keyframes jmp{0%{opacity:0}2%{opacity:1}10%{opacity:1;background:#3a0008}14%{background:#000}70%{opacity:1}100%{opacity:0}}
@keyframes jz{0%{transform:scale(.25) rotate(-6deg)}12%{transform:scale(1.15) rotate(3deg)}20%{transform:scale(1.05) translate(-6px,4px)}26%{transform:scale(1.1) translate(6px,-4px)}100%{transform:scale(1.25)}}
@media (prefers-reduced-motion:reduce){.jump{display:none}.frz-fig{opacity:1}}

.stage>.box:not(.dialog):first-child,.stage>.cut:first-child{margin-top:28px}

/* ===== cinema kit ===== */
.dialog.withp{padding-left:104px;min-height:120px}
.pt{position:absolute;left:14px;top:14px;width:76px;height:76px;border-radius:12px;overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,.5)}
.pt svg{display:block;width:100%;height:100%}

let typing=null,timers=[];

function current(){return SCRIPT[S.i]}
function next(){clearTimers();cineOff();S.i++;save();render()}
function passes(st){return !st.if||S.ch[st.if[0]]===st.if[1]}
function applyStep(st){if(st.scene)S.scene=st.scene;if(st.clock)S.clock=st.clock;if(st.viewers!=null)S.viewers=st.viewers;if(st.live!=null)S.live=st.live}
function render(){
  clearTimers();
  let st=current(),newChap=false;
  while(st&&(!passes(st)||st.t==='chapter'||st.t==='cp')){
    if(passes(st)){
      if(st.t==='chapter'){S.chap=st.n;S.chapName=st.name;S.scene=CHAP_SCENE[st.n];newChap=true}
      if(st.t==='cp'){S.i++;S.snap=null;S.snap=JSON.stringify(S);save();st=current();continue}
    }
    S.i++;st=current();
  }
  if(newChap)showChapterCard(S.chap,S.chapName);
  if(st)applyStep(st);
  setScene(S.scene);drawLive();
  if($('clock').textContent!==S.clock){$('clock').textContent=S.clock;fxRestart($('clock'),'ping')}
  $('chap').innerHTML=CH_LABEL[S.chap]+' · <b>'+S.chapName+'</b>';
  $('btnHint').disabled=!(st&&st.t==='puzzle');
  if(st&&st.t==='finale')audio.resolve();else audio.unresolve();
  stage.innerHTML='';
  if(!st)return;
  ({say:renderSay,ev:renderEv,chat:renderChat,choice:renderChoice,puzzle:st=>PUZZLES[st.id](),cut:renderCut,end:renderEnd,finale:renderFinale})[st.t](st);
}
function dialogShell(who,label){
  const box=document.createElement('div');box.className='box dialog';box.tabIndex=0;box.setAttribute('role','button');
  const name=label||WHO[who];
  if(name){const w=document.createElement('div');w.className='who '+who;w.textContent=name;box.appendChild(w)}
  stage.appendChild(box);return box;
}
function typeInto(el,text,done){
  if(reduce){if(typing&&typing.cancel)typing.cancel();typing=null;el.textContent=text;done&&done();return}
  let k=0;el.textContent='';
  if(typing&&typing.cancel)typing.cancel();const me={cancel(){clearInterval(id)},finish(){clearInterval(id);el.textContent=text;if(typing===me)typing=null;done&&done()}};typing=me;
  const id=setInterval(()=>{k++;el.textContent=text.slice(0,k);if(k%2)audio.tk();if(k>=text.length)me.finish()},30);
}
function bindGo(box,go){box.onclick=go;box.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go()}};box.focus({preventScroll:true})}
function renderSay(st){
  const box=dialogShell(st.who,st.label);if(typeof addPortrait==='function')addPortrait(box,st);

  const cont=document.createElement('div');cont.className='cont';cont.textContent='點一下繼續 ▸';cont.style.visibility='hidden';box.appendChild(cont);
  if(st.fx==='flicker')fxRestart($('flash'),'flicker');
  if(st.fx==='thud'){audio.thud();quake();fxRestart($('vig'),'red')}

}

  if(!S.ev.find(e=>e.id===st.id))S.ev.push({id:st.id,name:st.name,text:st.text});save();

/* ---------- chapter jump ---------- */
function chapterList(){const list=[];SCRIPT.forEach((s,i)=>{if(s.t==='chapter')list.push({n:s.n,name:s.name,idx:i})});return list}
function jumpTo(n){
  const c=chapterList().find(x=>x.n===n);if(!c)return;
  S=fresh();
  for(let k=0;k<c.idx;k++){const st=SCRIPT[k];if(st.if&&S.ch[st.if[0]]!==st.if[1])continue;
    if(st.t==='chapter'){S.chap=st.n;S.chapName=st.name}applyStep(st);
    if(st.t==='ev'&&!S.ev.find(e=>e.id===st.id))S.ev.push({id:st.id,name:st.name,text:st.text});
    if(st.t==='chat')st.msgs.forEach(([u,m])=>{if(USERS[u]&&['xg','fake','host','bao'].includes(USERS[u].k))S.log.push({u,m,t:S.clock})});
    if(st.t==='choice'){const o=st.options.find(o=>!o.die)||st.options[0];S.ch[st.key]=o.v;S.chText[st.key]=o.text}}
  S.i=c.idx;save();try{audio.init()}catch(e){}
  $('title').hidden=true;$('sheet').hidden=true;$('death').hidden=true;audio.unresolve();render();
}
function chapterSheet(){
  openSheet(`<h3>選擇章節</h3><ul>${chapterList().map(c=>`<li style="padding:0"><button class="chapjump" data-n="${c.n}" style="width:100%;text-align:left;background:transparent;border:0;padding:12px;min-height:48px"><b>${CH_LABEL[c.n]}</b>　${c.name}</button></li>`).join('')}</ul>${closeBtn()}`);
  document.querySelectorAll('.chapjump').forEach(b=>b.onclick=()=>jumpTo(+b.dataset.n));
}

.cp-noise{position:absolute;inset:-20%;background:${NOISE};background-size:180px;mix-blend-mode:overlay;opacity:.16;animation:cpNoiseIn 1.3s calc(.25s + var(--i)*.18s) ease-out both,cpGrain .5s steps(3) infinite}
@keyframes cpNoiseIn{from{opacity:1}}
.cp-shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.5),transparent 28%,transparent 48%,rgba(0,0,0,.88))}
.cp-hud{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;font-family:${MONO};font-size:11px;letter-spacing:.12em}
.cp-rec{color:#ff4a4a;animation:cpBlink 1.2s steps(1) infinite}
@keyframes cpBlink{50%{opacity:.25}}
.cp-gen{position:absolute;left:12px;right:12px;top:50%;transform:translateY(-50%);display:flex;align-items:center;justify-content:center;gap:8px;font-family:${MONO};font-size:12px;transition:opacity .4s}
.cp-gen i{width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:cpSpin .8s linear infinite}
@keyframes cpSpin{to{transform:rotate(360deg)}}
.cp-card.done .cp-gen{opacity:0}
.cp-num{position:absolute;right:10px;bottom:52px;font-family:${SERIF};font-weight:900;font-size:76px;line-height:1;color:transparent;-webkit-text-stroke:1px rgba(255,255,255,.35)}
.cp-title{position:absolute;left:14px;right:14px;bottom:14px;display:flex;flex-direction:column}
.cp-title small{font-size:12px;color:${ACC};letter-spacing:.2em}
.cp-title b{font-family:${SERIF};font-weight:900;font-size:24px;line-height:1.3;text-shadow:0 2px 12px #000}
.cp-meta{display:flex;flex-direction:column;gap:6px;padding-inline:2px}
.cp-sub{font-size:13px;color:#a39cb4}
.cp-prompt{font-family:${MONO};font-size:11px;color:#8a83a0;line-height:1.5;border-left:2px solid ${ACC};padding-left:8px}
.cp-go{display:flex;align-items:center;justify-content:center;gap:8px;min-height:46px;border-radius:12px;border:0;background:${ACC};color:#0b0910;font-weight:700;font-size:15px}
.cp-go svg{width:16px;height:16px}
.cp-chips{display:flex;justify-content:center;gap:8px;padding-inline:16px;flex-wrap:wrap}
.cp-chip{width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.18);background:transparent;color:#a39cb4;font-family:${MONO};font-size:13px;padding:0}
.cp-chip.on{background:${ACC};color:#0b0910;border-color:${ACC}}
.cp-fly{position:fixed;z-index:60;border-radius:18px;overflow:hidden;background:#000;transition:left .75s cubic-bezier(.7,0,.2,1),top .75s cubic-bezier(.7,0,.2,1),width .75s cubic-bezier(.7,0,.2,1),height .75s cubic-bezier(.7,0,.2,1),border-radius .75s}
.cp-fly.full{left:0!important;top:0!important;width:100vw!important;height:100vh!important;border-radius:0}
.cp-fly .cp-kb svg{animation:none;transform:scale(1.12)}
.cp-fly.dive .cp-kb{animation:cpDive 1.2s cubic-bezier(.5,0,.8,.4) forwards}
@keyframes cpDive{to{transform:scale(1.7);filter:blur(5px) brightness(2.3) saturate(1.6)}}
.cp-scan{position:absolute;left:0;right:0;height:30%;top:-30%;background:linear-gradient(180deg,transparent,rgba(255,255,255,.2),transparent);animation:cpScan 1.1s .2s linear 2}
@keyframes cpScan{to{top:100%}}
.cp-fly.out,.cp-launch.out{opacity:0;transition:opacity .55s;pointer-events:none}
.cp-launch{position:fixed;inset:0;z-index:61;display:flex;flex-direction:column;justify-content:flex-end;gap:10px;padding:0 20px calc(40px + env(safe-area-inset-bottom,0px));cursor:pointer;background:linear-gradient(180deg,transparent 50%,rgba(0,0,0,.65));color:#fff}
.cp-type{font-family:${MONO};font-size:13px;color:#e8f4ee;min-height:1.6em}
.cp-caret{display:inline-block;width:8px;height:14px;margin-left:2px;background:${ACC};vertical-align:middle;animation:cpBlink .6s steps(1) infinite}
.cp-bar{height:3px;background:rgba(255,255,255,.15);border-radius:2px;overflow:hidden}
.cp-bar i{display:block;height:100%;background:${ACC};transform-origin:left;animation:cpBar 1.5s cubic-bezier(.3,.1,.2,1) both}
@keyframes cpBar{from{transform:scaleX(0)}}
.cp-big{position:absolute;left:16px;right:16px;top:38%;text-align:center;opacity:0;transform:scale(1.15);filter:blur(10px);transition:opacity .6s,transform .6s,filter .6s}
.cp-launch.reveal .cp-big{opacity:1;transform:none;filter:none}
.cp-big small{display:block;font-family:${MONO};letter-spacing:.5em;color:${ACC};font-size:13px}
.cp-big b{font-family:${SERIF};font-weight:900;font-size:clamp(40px,12vw,64px);text-shadow:0 0 30px rgba(0,0,0,.8),2px 0 rgba(255,0,60,.55),-2px 0 rgba(0,220,255,.55)}
.cp-burst{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
@media (prefers-reduced-motion:reduce){.cp,.cp *{animation:none!important;transition:none!important}}`;
const st=document.createElement('style');st.textContent=CSS;document.head.appendChild(st);

/* ---------- AI-video chapter picker ---------- */
const pad=n=>String(n).padStart(2,'0');
function sceneFor(list,i){
  const c=list[i];
  try{if(typeof CHAP_SCENE!=='undefined'&&CHAP_SCENE[c.n]&&SCENES[CHAP_SCENE[c.n]])return CHAP_SCENE[c.n]}catch(e){}
  const end=i+1<list.length?list[i+1].idx:SCRIPT.length;
  for(let k=c.idx;k<end;k++){const s=SCRIPT[k];if(s&&s.scene&&SCENES[s.scene])return s.scene}
  return Object.keys(SCENES)[0];
}
const subOf=n=>{try{return (typeof CC_SUB!=='undefined'&&CC_SUB[n])||''}catch(e){return ''}};
let open=null,busy=false;
function card(c,i,list,cur){
  const k=sceneFor(list,i),sub=subOf(c.n);
  const prompt=`${c.name}，${sub.replace(/ · /g,'，')}，深夜，電影感光影，懸疑`;
  return `<article class="cp-card${c.n===cur?' cur':''}" style="--i:${i}" data-i="${i}">
   <button class="cp-thumb" data-n="${c.n}" aria-label="從${CH_LABEL[c.n]}「${c.name}」開始">
    <div class="cp-art"><div class="cp-kb">${SCENES[k]}</div></div><div class="cp-rays"></div><div class="cp-noise"></div><div class="cp-shade"></div>
    <div class="cp-hud"><span class="cp-rec">● REC</span><span>${c.n===cur?'目前進度':'SCENE '+pad(c.n)}</span></div>
    <div class="cp-gen"><i></i><span>生成中</span><b>0%</b></div>
    <div class="cp-num">${pad(c.n)}</div>
    <div class="cp-title"><small>${CH_LABEL[c.n]}</small><b>${c.name}</b></div>
   </button>
   <div class="cp-meta"><div class="cp-sub">${sub}</div><div class="cp-prompt">▸ prompt：${prompt}</div>
    <button class="cp-go" data-n="${c.n}">${svgI('play')}從這裡開始</button></div>
  </article>`;
}
function cinePick(){
  if(open)return;
  const list=chapterList(),title=document.getElementById('title');
  const cur=title&&title.hidden?S.chap:0;
  const el=document.createElement('div');el.className='cp';el.setAttribute('role','dialog');el.setAttribute('aria-label','選擇章節');
  el.innerHTML=`<div class="cp-grain"></div>
   <div class="cp-head"><div><div class="cp-k">${svgI('film')}SCENE SELECT</div><h3>選擇章節</h3><p>滑動挑一個場景，從那一刻開始。前面的線索會自動補上。</p></div><button class="cp-x" aria-label="關閉">${svgI('x')}</button></div>
   <div class="cp-rail">${list.map((c,i)=>card(c,i,list,cur)).join('')}</div>
   <div class="cp-chips">${list.map((c,i)=>`<button class="cp-chip${c.n===(cur||list[0].n)?' on':''}" data-i="${i}" aria-label="${CH_LABEL[c.n]}">${pad(c.n)}</button>`).join('')}</div>`;
  document.body.appendChild(el);open=el;
  const rail=el.querySelector('.cp-rail'),cards=[...el.querySelectorAll('.cp-card')],chips=[...el.querySelectorAll('.cp-chip')];
  const ci=cur?list.findIndex(c=>c.n===cur):0;
  if(ci>0)rail.scrollLeft=cards[ci].offsetLeft-16;
  cards.forEach((cd,i)=>{
    const b=cd.querySelector('.cp-gen b');
    if(reduceM){cd.classList.add('done');return}
    const t0=performance.now()+250+i*180;
    (function tick(t){const p=Math.max(0,Math.min(1,(t-t0)/1300));b.textContent=Math.round(p*100)+'%';if(p<1&&open===el)requestAnimationFrame(tick);else cd.classList.add('done')})(performance.now());
  });
  rail.addEventListener('scroll',()=>{const mid=rail.scrollLeft+rail.clientWidth/2;let best=0,d=1e9;cards.forEach((c,i)=>{const m=c.offsetLeft+c.offsetWidth/2;if(Math.abs(m-mid)<d){d=Math.abs(m-mid);best=i}});chips.forEach((c,i)=>c.classList.toggle('on',i===best))},{passive:true});
  el.addEventListener('click',e=>{
    if(e.target.closest('.cp-x'))return closePick();
    const ch=e.target.closest('.cp-chip');if(ch){cards[+ch.dataset.i].scrollIntoView({behavior:reduceM?'auto':'smooth',inline:'center',block:'nearest'});return}
    const go=e.target.closest('.cp-thumb,.cp-go');if(go)launch(+go.dataset.n,go.closest('.cp-card').querySelector('.cp-thumb'));
  });
  el.querySelector('.cp-x').focus({preventScroll:true});
}
function closePick(){if(!open)return;const el=open;open=null;el.classList.add('closing');setTimeout(()=>el.remove(),340)}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&open&&!busy)closePick()});
function finishJump(n){if(open){open.remove();open=null}busy=false;try{jumpTo(n)}catch(err){console.error(err)}}
function launch(n,thumb){
  if(busy)return;busy=true;
  const c=chapterList().find(x=>x.n===n);
  try{if(typeof audio!=='undefined'&&audio.init)audio.init()}catch(e){}
  if(reduceM){finishJump(n);return}
  const r=thumb.getBoundingClientRect();
  const fly=document.createElement('div');fly.className='cp-fly';
  fly.innerHTML=`<div class="cp-kb">${thumb.querySelector('.cp-kb').innerHTML}</div><div class="cp-rays"></div><div class="cp-scan"></div>`;
  Object.assign(fly.style,{left:r.left+'px',top:r.top+'px',width:r.width+'px',height:r.height+'px'});
  const ov=document.createElement('div');ov.className='cp-launch';
  ov.innerHTML=`<div class="cp-big"><small>${CH_LABEL[n]}</small><b>${c.name}</b></div><div class="cp-type"></div><div class="cp-bar"><i></i></div><canvas class="cp-burst"></canvas>`;
  document.body.append(fly,ov);open.classList.add('leaving');
  requestAnimationFrame(()=>requestAnimationFrame(()=>fly.classList.add('full')));
  const text=`> 生成場景：${CH_LABEL[n]}「${c.name}」 ${subOf(n)}`,ty=ov.querySelector('.cp-type');let k=0;
  const tyI=setInterval(()=>{k++;ty.innerHTML=text.slice(0,k).replace(/[&<>]/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;'})[s])+'<span class="cp-caret"></span>';if(k>=text.length)clearInterval(tyI)},Math.max(18,1000/text.length));
  const T=[setTimeout(()=>fly.classList.add('dive'),900),setTimeout(()=>ov.classList.add('reveal'),1050),setTimeout(()=>burst(ov.querySelector('.cp-burst')),1650),setTimeout(done,2150)];
  let finished=false;
  function done(){if(finished)return;finished=true;T.forEach(clearTimeout);clearInterval(tyI);finishJump(n);fly.classList.add('out');ov.classList.add('out');setTimeout(()=>{fly.remove();ov.remove()},600)}
  ov.addEventListener('click',done);
}
function burst(cv){
  const w=cv.width=innerWidth,h=cv.height=innerHeight,x=cv.getContext('2d');if(!x)return;
  const P=Array.from({length:220},()=>{const a=Math.random()*6.283,s=2+Math.random()*10;return {x:w/2,y:h*.45,vx:Math.cos(a)*s,vy:Math.sin(a)*s,r:1+Math.random()*2.6}});
  const t0=performance.now();
  (function f(t){const e=(t-t0)/700;x.clearRect(0,0,w,h);x.globalCompositeOperation='lighter';
    for(const p of P){p.x+=p.vx;p.y+=p.vy;p.vx*=.95;p.vy*=.95;x.globalAlpha=Math.max(0,1-e);x.fillStyle=Math.random()<.3?'#fff':ACC;x.beginPath();x.arc(p.x,p.y,p.r,0,6.283);x.fill()}
    if(e<1)requestAnimationFrame(f)})(t0);
}

/* ---------- bind ---------- */
window.cinePick=cinePick;
const b=document.getElementById('btnChap');if(b)b.onclick=cinePick;
const lab=document.getElementById('chap');if(lab){lab.onclick=cinePick;lab.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();cinePick()}}}
decorate();
new MutationObserver(sched).observe(document.body,{childList:true,subtree:true,characterData:true});
})();

/* ---------- episode deep link (#ch3) + resume audio on first tap ---------- */
(function(){
  const m=/^#ch(\d)$/.exec(location.hash||'');
  if(m&&typeof jumpTo==='function'){setTimeout(()=>{try{jumpTo(+m[1])}catch(e){}try{history.replaceState(null,'',location.pathname)}catch(e){}},60)}
  const wake=()=>{try{if(typeof audio!=='undefined'){if(!audio.ctx&&audio.init)audio.init();if(audio.ctx&&audio.ctx.state==='suspended')audio.ctx.resume()}}catch(e){}};
  document.addEventListener('pointerdown',wake,{capture:true});document.addEventListener('keydown',wake,{capture:true});
})();
