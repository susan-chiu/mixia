<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>html{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}.home-link{text-decoration:none;display:inline-flex;align-items:center;justify-content:center}</style>
<title>雲頂旅社住宿須知</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&display=swap">
<style>
/* Layout: one-screen horror console — HUD on top, a living scene behind the story panel. Deliberately single dark look. */
:root{
  --ink:#0b0d11; --wall:#151920; --panel:#181d26; --line:#2c3443;
  --sil:#12161d; --sil2:#212836;
  --paper:#e4d9bf; --paper-ink:#2a241b; --red:#b8322a; --redglow:#ff4a3d;
  --lamp:#d9c58e; --ok:#86c9a3; --text:#e6e2d8; --muted:#8f99ab;
  --f-display:"Noto Serif TC","Songti TC",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-hand:"LXGW WenKai TC","Kaiti TC","DFKai-SB",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ink);color:var(--text);font-family:var(--f-body);font-size:16px;line-height:1.7;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--lamp);outline-offset:2px}
#app{height:100%;max-width:480px;margin:0 auto;padding-inline:16px;padding-block:10px 14px;display:flex;flex-direction:column;gap:10px}
.bar{display:flex;align-items:center;gap:8px}
.chap{flex:1;min-width:0;font-size:13px;color:var(--muted);letter-spacing:.08em}
.chap b{color:var(--text);font-weight:500}
.clock{font-family:var(--f-mono);font-size:14px;color:var(--lamp);padding:2px 8px;border:1px solid var(--line);border-radius:6px}
.tools{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.icon-btn{background:transparent;border:1px solid var(--line);border-radius:8px;padding:5px 4px;font-size:13px;color:var(--text);min-height:36px}
.icon-btn:disabled{opacity:.35;cursor:default}
.icon-btn.rule{border-color:#5a3a30;color:#f0c8b8}
.status{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted);min-height:18px}
.batt{display:flex;gap:3px}
.batt i{width:10px;height:14px;border-radius:2px;background:rgba(255,255,255,.1)}
.batt i.on{background:var(--lamp)}
.batt i.low{background:var(--red)}

.stage-wrap{flex:1;min-height:0;position:relative;display:flex}
.stage{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:12px;position:relative;z-index:1}
.scene{position:absolute;inset:0;border-radius:14px;overflow:hidden;pointer-events:none;background:linear-gradient(#141821,#0b0d11)}
.scene[data-k=bus]{background:linear-gradient(#0d1420,#070a10)}
.scene[data-k=basement]{background:linear-gradient(#0e0f10,#060606)}
.scene[data-k=floor4]{background:linear-gradient(#0f1714,#070b09)}
.scene[data-k=exit]{background:linear-gradient(#3a3226,#1a160f)}
.scene::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(217,197,142,0) 20%,rgba(255,214,150,.35));opacity:0;transition:opacity 4s}
.scene.dawn::after{opacity:1}
#sceneArt{position:absolute;inset:0;animation:sceneIn 1.4s ease}
#sceneArt svg{position:absolute;inset:0;width:100%;height:100%}
#motes{position:absolute;inset:0;width:100%;height:100%}
@keyframes sceneIn{from{opacity:0;transform:scale(1.05)}}
.s1{fill:var(--sil)} .s2{fill:var(--sil2)} .st{stroke:var(--sil2);fill:none}
.flick{animation:flick 6s infinite}
@keyframes flick{0%,38%,42%,46%,100%{opacity:.8}40%,44%{opacity:.05}}
.sway{transform-origin:200px 160px;animation:sway 3.5s ease-in-out infinite alternate}
@keyframes sway{from{transform:translateX(-2px)}to{transform:translateX(2px)}}
.beckon{transform-origin:330px 150px;animation:beckon 1.6s ease-in-out infinite}
@keyframes beckon{50%{transform:rotate(-14deg)}}

.box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;position:relative}
.dialog{margin-top:auto;cursor:pointer;min-height:132px;display:flex;flex-direction:column;gap:6px;background:rgba(22,27,36,.94);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.who{font-size:12px;letter-spacing:.12em;color:var(--muted)}
.who.me{color:var(--ok)} .who.xk{color:#9ec3f0} .who.yq{color:#e8b7d0} .who.teacher{color:var(--lamp)} .who.voice{color:var(--redglow)}
.line{font-size:17px;min-height:2.6em}
.line.narr{color:#c9ccd4}
.line.voice{font-family:var(--f-display);font-weight:600;color:#f6d5cf;animation:vglitch .9s ease-out}
@keyframes vglitch{0%{opacity:0;text-shadow:3px 0 rgba(255,74,61,.9),-3px 0 rgba(120,200,255,.6)}30%{opacity:1}45%{opacity:.4;text-shadow:-2px 0 rgba(255,74,61,.7)}60%{opacity:1}100%{text-shadow:none}}
.cont{align-self:flex-end;font-size:12px;color:var(--muted)}
.choices{display:grid;gap:8px;margin-top:4px}
.choice{text-align:left;background:var(--wall);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.choice:hover{border-color:var(--lamp)}
.timer{height:5px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden}
.timer i{display:block;height:100%;background:var(--red);transform-origin:left;animation:drain linear forwards}
@keyframes drain{from{transform:scaleX(1)}to{transform:scaleX(0)}}
.ev-tag{display:inline-block;background:var(--paper);color:var(--paper-ink);border-radius:4px;padding:2px 10px;font-weight:500;transform:rotate(-1deg);animation:evin .7s cubic-bezier(.2,1.4,.4,1)}
@keyframes evin{from{opacity:0;transform:translateY(-24px) rotate(-12deg) scale(1.2)}}

.ptitle{font-family:var(--f-display);font-weight:900;font-size:20px;margin:0}
.pdesc{color:#c9ccd4;margin:4px 0 0;font-size:15px}
.st-msg{font-size:14px;color:var(--muted);min-height:1.6em}
.st-msg.good{color:var(--ok)} .st-msg.bad{color:var(--redglow)}
.btn{background:var(--lamp);color:#1c170c;border:0;border-radius:10px;padding:12px 16px;font-weight:700;min-height:44px}
.btn:disabled{opacity:.4;cursor:default}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line);font-weight:500}
.btn.danger{background:var(--red);color:#fff}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.cap{font-size:12px;color:var(--muted);letter-spacing:.06em;margin-bottom:6px}
.answer{display:flex;gap:8px}
.answer input{flex:1;min-width:0;background:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--text);font-size:18px;letter-spacing:.2em}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}

/* the rule sheet — paper, black & red ink */
.paper{background:var(--paper);color:var(--paper-ink);border-radius:3px;padding:14px 14px 12px;box-shadow:0 8px 22px rgba(0,0,0,.55);font-family:var(--f-hand)}
.paper h4{margin:0 0 8px;font-family:var(--f-display);font-weight:900;font-size:16px;text-align:center;letter-spacing:.3em;border-bottom:1px solid rgba(0,0,0,.25);padding-bottom:6px}
.rl{display:flex;gap:8px;padding:3px 0;font-size:16px;line-height:1.5;border-radius:3px}
.rl b{font-family:var(--f-mono);font-weight:500;font-size:12px;opacity:.6;width:1.4em;flex:none;padding-top:3px}
.rl.red{color:var(--red)}
.rl.fake span{text-decoration:line-through;text-decoration-thickness:2px;opacity:.55}
.rl.pick{cursor:pointer}
.rl.pick:hover{background:rgba(0,0,0,.05)}
.rl.marked{background:rgba(184,50,42,.12)}
.rl.marked b::after{content:"✕";color:var(--red);margin-left:2px}
.rl.new span{animation:inkin 1.6s ease}
@keyframes inkin{0%{opacity:0;filter:blur(4px);letter-spacing:.3em}100%{opacity:1;filter:none}}
.torn{height:14px;background:linear-gradient(135deg,var(--paper) 25%,transparent 25%) -7px 0/14px 14px,linear-gradient(225deg,var(--paper) 25%,transparent 25%) -7px 0/14px 14px;margin:6px -14px -26px}
.note-hand{font-family:var(--f-hand);font-size:15px;color:#3d3426;margin-top:8px;border-top:1px dashed rgba(0,0,0,.25);padding-top:6px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
@media (max-width:420px){.two{grid-template-columns:1fr}}

/* roster */
.roster{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px}
.roster td,.roster th{border-bottom:1px solid rgba(0,0,0,.18);padding:4px 4px;text-align:left}
.roster th{font-weight:700}
.wall{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.photo{display:flex;flex-direction:column;align-items:center;gap:4px;background:#d8ccb0;color:var(--paper-ink);border:6px solid #efe6d0;border-bottom-width:14px;padding:6px 4px;box-shadow:0 4px 10px rgba(0,0,0,.5);min-width:0}
.photo svg{width:56px;height:56px}
.photo span{font-size:12px;line-height:1.3;text-align:center}
.photo.on{outline:3px solid var(--redglow);outline-offset:2px}

/* fuse box */
.fuse{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:12px}
.floors{display:grid;gap:6px}
.fl{display:flex;align-items:center;gap:10px;background:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-family:var(--f-mono);font-size:14px}
.fl i{width:16px;height:16px;border-radius:50%;background:#2a2a24;transition:all .2s}
.fl.on i{background:var(--lamp);box-shadow:0 0 12px 3px rgba(217,197,142,.6)}
.fl.f4.on i{background:var(--redglow);box-shadow:0 0 14px 4px rgba(255,74,61,.7)}
.brk{display:grid;gap:6px}
.sw{display:flex;align-items:center;gap:10px;background:#20242c;border:1px solid var(--line);border-radius:8px;padding:6px 10px;text-align:left}
.sw .k{width:22px;height:34px;border-radius:4px;background:#0c0e12;position:relative;flex:none}
.sw .k::after{content:"";position:absolute;left:3px;right:3px;height:14px;border-radius:2px;background:#8f99ab;top:17px;transition:top .15s}
.sw.on .k::after{top:3px;background:var(--lamp)}
.sw span{font-size:13px;line-height:1.35}

/* route */
.nodes{display:grid;gap:8px;margin-top:12px}
.node{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--wall);border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-align:left}
.node b{font-family:var(--f-mono);color:var(--lamp);min-width:1.5em}
.node.used{opacity:.4}
.tl{font-family:var(--f-mono);font-size:13px;background:var(--ink);border:1px dashed var(--line);border-radius:8px;padding:8px 10px;margin-top:10px;min-height:44px}
.mapnote{font-family:var(--f-hand);font-size:14px;line-height:1.6}

/* overlays */
.sheet{position:fixed;inset:0;background:rgba(3,4,6,.75);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet>div{width:100%;max-width:480px;max-height:85%;overflow:auto;background:var(--panel);border-top:1px solid var(--line);border-radius:16px 16px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.sheet h3{font-family:var(--f-display);margin:0 0 10px;font-size:18px}
.sheet ul{padding-left:0;list-style:none;margin:0;display:grid;gap:8px}
.sheet li{background:var(--wall);border-radius:8px;padding:10px 12px;font-size:15px}
.locked{color:var(--muted)}
.title{position:fixed;inset:0;z-index:5;background:radial-gradient(ellipse at 50% 25%,#2a1412 0%,var(--ink) 62%);display:flex;align-items:center;justify-content:center;padding-inline:24px}
.title-inner{max-width:420px;display:grid;gap:14px}
.title h1{font-family:var(--f-display);font-weight:900;font-size:clamp(38px,11vw,56px);line-height:1.15;margin:0;color:var(--paper);text-wrap:balance}
.title h1 em{font-style:normal;display:block;font-family:var(--f-hand);color:var(--red);font-size:.5em;letter-spacing:.2em;text-shadow:0 0 14px rgba(255,74,61,.5)}
.title p{color:#c9ccd4;margin:0}
.title .meta{font-size:12px;letter-spacing:.14em;color:var(--muted)}
.death{position:fixed;inset:0;z-index:9;background:#050505;display:flex;align-items:center;justify-content:center;padding-inline:24px;animation:dIn 1.2s ease}
@keyframes dIn{0%{background:#5a0a06}15%{background:#050505}25%{background:#2a0503}40%{background:#050505}}
.death-inner{max-width:400px;display:grid;gap:14px;text-align:center}
.death .d-k{font-family:var(--f-mono);letter-spacing:.4em;color:var(--red);font-size:13px}
.death h2{font-family:var(--f-display);font-weight:900;font-size:32px;margin:0;color:#f3e6e3;animation:dT 1.6s ease}
@keyframes dT{from{letter-spacing:.6em;opacity:0;filter:blur(8px)}}
.death p{margin:0;color:#c9b8b4;font-size:16px}
.death .d-rule{font-family:var(--f-hand);color:var(--paper-ink);background:var(--paper);padding:10px 12px;border-radius:3px;font-size:15px;transform:rotate(-1deg)}
.death .row{justify-content:center}
.chapcard{position:fixed;inset:0;z-index:8;background:var(--ink);display:flex;align-items:center;justify-content:center;padding-inline:24px;text-align:center;cursor:pointer;animation:ccIn 3.2s ease forwards}
@keyframes ccIn{0%{opacity:0}15%{opacity:1}80%{opacity:1}100%{opacity:0}}
.cc-k{font-family:var(--f-mono);font-size:13px;letter-spacing:.4em;color:var(--red);animation:ccT 3s ease}
.cc-n{font-family:var(--f-display);font-weight:900;font-size:clamp(38px,11vw,56px);color:var(--paper);margin:8px 0;animation:ccT 3s ease}
.cc-s{color:var(--muted);font-size:14px;letter-spacing:.1em}
@keyframes ccT{from{letter-spacing:.9em;opacity:0;filter:blur(6px)}40%{opacity:1;filter:none}}
.vignette{position:fixed;inset:0;pointer-events:none;z-index:4;opacity:0;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 42%,rgba(150,6,6,.5) 100%)}
.vignette.beat{animation:beat .45s ease-out}
.vignette.red{animation:beat .9s ease-out}
@keyframes beat{0%{opacity:0}25%{opacity:1}100%{opacity:0}}
.flash{position:fixed;inset:0;pointer-events:none;z-index:6;opacity:0;background:#e8eef7}
.flash.flicker{animation:fl 1.1s steps(1)}
@keyframes fl{0%{opacity:0}8%{opacity:.18}14%{opacity:0}30%{opacity:.12}36%{opacity:0}52%{opacity:.08}58%{opacity:0}}
.flash.cut{background:#000;animation:cut 1.6s ease-out}
@keyframes cut{0%{opacity:.95}60%{opacity:.85}100%{opacity:0}}
.ping{animation:ping 1.2s ease-out}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(255,74,61,.8)}100%{box-shadow:0 0 0 14px rgba(255,74,61,0)}}
.endcard h2{font-family:var(--f-display);font-weight:900;font-size:28px;margin:0 0 6px;color:var(--paper)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px 0}
.stats div{background:var(--wall);border-radius:8px;padding:10px;text-align:center}
.stats b{display:block;font-family:var(--f-mono);font-size:22px;color:var(--lamp)}
.stats span{font-size:12px;color:var(--muted)}
.next{border-top:1px dashed var(--line);margin-top:12px;padding-top:12px;color:#c9ccd4;font-size:15px}

/* cutscenes — base styles are the END state */
.cut{position:relative;flex:1;min-height:300px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;cursor:pointer;padding-block:12px;perspective:700px}
.cut>.cont{position:absolute;bottom:4px;right:4px}
.cap2{font-family:var(--f-display);font-weight:600;font-size:18px;color:var(--paper);text-align:center;text-shadow:0 2px 12px rgba(0,0,0,.9);animation:fadeUp .9s var(--d,0s) both}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}}
.cut .paper{width:min(320px,100%);animation:unroll 1s ease both;transform-origin:top}
@keyframes unroll{from{transform:scaleY(.05);opacity:0}}
.cut .rl{animation:fadeUp .5s var(--d) both}
.cut .rl.red{animation:bleed 1.2s var(--d) both}
@keyframes bleed{0%{opacity:0;filter:blur(3px)}50%{opacity:1;color:var(--redglow);text-shadow:0 0 6px rgba(255,74,61,.6)}}
.elev{display:flex;gap:10px;background:#1a1a1a;border:3px solid #3a3a3a;border-radius:6px;padding:10px 14px}
.elev span{font-family:var(--f-mono);font-size:28px;color:#3a3a3a;width:1em;text-align:center}
.elev span.lit{color:var(--redglow);text-shadow:0 0 12px var(--redglow);animation:litup .4s var(--d) steps(1) both}
@keyframes litup{from{color:#3a3a3a;text-shadow:none}}
.elev span.pass{animation:pass .9s var(--d) steps(1) both}
@keyframes pass{0%{color:#3a3a3a}1%{color:var(--lamp);text-shadow:0 0 10px var(--lamp)}100%{color:#3a3a3a;text-shadow:none}}
.door2{display:flex;width:220px;height:170px;background:radial-gradient(ellipse at 50% 60%,#fff4d6,#f2c983 60%,#c08b4a);border-radius:4px;overflow:hidden;box-shadow:0 0 60px rgba(255,214,150,.5)}
.door2 i{flex:1;background:linear-gradient(90deg,#2a2018,#3b2a1f);transform:scaleX(.08);animation:dopen 1.6s .6s ease-in-out both}
.door2 i:first-child{transform-origin:left} .door2 i:last-child{transform-origin:right}
@keyframes dopen{from{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){.cut *,.flick,.sway,.beckon,.line.voice,.ev-tag,.cc-k,.cc-n,#sceneArt,.death h2,.death{animation:none!important}.vignette,.flash{display:none}}

/* ===== cinema kit ===== */
.dialog.withp{padding-left:104px;min-height:120px}
.pt{position:absolute;left:14px;top:14px;width:76px;height:76px;border-radius:12px;overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,.5)}
.pt svg{display:block;width:100%;height:100%}
.pt.enter{animation:ptin .4s cubic-bezier(.2,1.3,.4,1)}
@keyframes ptin{from{opacity:0;transform:translateX(-14px) scale(.9)}}
.pt.sil{animation:ptin .4s, ptgl 2.2s steps(1) infinite}
@keyframes ptgl{0%,86%,100%{transform:none;filter:none}88%{transform:translateX(-3px);filter:hue-rotate(40deg)}92%{transform:translateX(3px)}}
.dialog{animation:dlgin .35s ease-out}
@keyframes dlgin{from{opacity:.4;transform:translateY(8px)}}
body::before,body::after{content:"";position:fixed;left:0;right:0;height:0;background:#000;z-index:3;transition:height .5s ease;pointer-events:none}
body::before{top:0} body::after{bottom:0}
body.cine::before,body.cine::after{height:7vh}
.scene::before{content:"";position:absolute;inset:0;background:#000;opacity:0;z-index:2;pointer-events:none}
.scene.dip::before{animation:dip .9s ease}
@keyframes dip{0%{opacity:0}35%{opacity:1}100%{opacity:0}}
#sceneArt svg{animation:kb 24s ease-in-out infinite alternate;transform-origin:50% 55%}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.08) translate(-1%,1%)}}
/* shared cutscene props */
.cs-stage{position:relative;width:min(300px,100%);height:190px;border-radius:10px;overflow:hidden;background:#06080b;box-shadow:0 10px 30px rgba(0,0,0,.6)}
.cs-rain{position:absolute;inset:0;background:repeating-linear-gradient(105deg,rgba(170,190,220,.0) 0 9px,rgba(170,190,220,.22) 9px 10px);background-size:40px 40px;animation:rainmv .5s linear infinite}
@keyframes rainmv{to{background-position:-12px 40px}}
.cs-sign{position:absolute;left:50%;top:38px;transform:translateX(-50%);font-family:var(--f-display);font-weight:900;font-size:26px;letter-spacing:.3em;color:#f2d39a;text-shadow:0 0 14px rgba(255,190,120,.7);opacity:.95;animation:signon 2.4s .6s steps(1) both}
@keyframes signon{0%{opacity:0}12%{opacity:.9}16%{opacity:0}30%{opacity:.9}34%{opacity:.1}55%,100%{opacity:.95}}
.cs-house{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:190px;height:110px;background:#0d1016;clip-path:polygon(0 35%,50% 0,100% 35%,100% 100%,0 100%)}
.cs-house i{position:absolute;width:18px;height:16px;background:#1d222c}
.cs-lights{position:absolute;bottom:14px;left:18px;display:flex;gap:22px;animation:hl 2.6s ease both}

const MOTE_KIND={bus:'rain',lobby:'dust',room:'dust',corridor:'dust',redvest:'dust',basement:'dust',floor4:'dust',exit:'warm'};
let curScene=null,motes=[],moteKind='dust';
function setScene(k){
  if(k===curScene)return;if(curScene)sceneDip();curScene=k;
  $('scene').dataset.k=k;
  const art=$('sceneArt');art.style.animation='none';void art.offsetWidth;art.style.animation='';art.innerHTML=SCENES[k]||'';
  initMotes(MOTE_KIND[k]||'dust');audio.apply();
}
function initMotes(kind){
  moteKind=kind;const n=kind==='rain'?90:kind==='warm'?16:30;
  motes=Array.from({length:n},()=>({x:Math.random(),y:Math.random(),r:kind==='warm'?8+Math.random()*16:.5+Math.random()*1.4,
    vx:kind==='rain'?-.002:(Math.random()-.5)*.00025,vy:kind==='rain'?.012+Math.random()*.008:kind==='warm'?-.0003:(Math.random()-.5)*.00015,p:Math.random()*6.28}));
}
const mc=$('motes'),mx=mc.getContext('2d');
function drawMotes(t){
  const dpr=Math.min(2,devicePixelRatio||1),w=mc.clientWidth,h=mc.clientHeight;if(!w||!h)return;
  if(mc.width!==Math.round(w*dpr)){mc.width=Math.round(w*dpr);mc.height=Math.round(h*dpr)}
  mx.setTransform(dpr,0,0,dpr,0,0);mx.clearRect(0,0,w,h);
  for(const m of motes){
    if(!reduce){m.x+=m.vx;m.y+=m.vy;if(m.x<-.05)m.x=1.05;if(m.x>1.05)m.x=-.05;if(m.y<-.1)m.y=1.1;if(m.y>1.1)m.y=-.1}
    const X=m.x*w,Y=m.y*h;
    if(moteKind==='rain'){mx.strokeStyle='rgba(170,190,220,.25)';mx.lineWidth=1;mx.beginPath();mx.moveTo(X,Y);mx.lineTo(X-3,Y+14);mx.stroke()}
    else if(moteKind==='warm'){const g=mx.createRadialGradient(X,Y,0,X,Y,m.r);g.addColorStop(0,'rgba(255,214,150,.18)');g.addColorStop(1,'rgba(255,214,150,0)');mx.fillStyle=g;mx.beginPath();mx.arc(X,Y,m.r,0,6.28);mx.fill()}
    else{mx.fillStyle=`rgba(217,197,142,${.12+.1*Math.sin(t*.001+m.p)})`;mx.beginPath();mx.arc(X,Y,m.r,0,6.28);mx.fill()}
  }
}
if(!reduce)(function loop(t){drawMotes(t);requestAnimationFrame(loop)})(0);

/* ================= engine ================= */
let typing=null,timers=[];
function clearTimers(){timers.forEach(t=>{clearTimeout(t);clearInterval(t)});timers=[]}
function current(){return SCRIPT[S.i]}
function next(){clearTimers();cineOff();S.i++;save();render()}
function passes(st){return !st.if||S.ch[st.if[0]]===st.if[1]}
function render(){
  clearTimers();
  let st=current(),newChap=false;
  while(st&&(!passes(st)||st.t==='chapter'||st.t==='cp')){
    if(passes(st)){
      if(st.t==='chapter'){S.chap=st.n;S.chapName=st.name;S.scene=CHAP_SCENE[st.n];newChap=true;if(st.n===3)S.battery=8}
      if(st.t==='cp'){S.i++;S.snap=null;S.snap=JSON.stringify(S);save();st=current();continue}
    }
    S.i++;st=current();
  }
  if(newChap)showChapterCard(S.chap,S.chapName);
  if(st&&st.scene)S.scene=st.scene;
  setScene(S.scene||CHAP_SCENE[S.chap]);
  if(st&&st.clock)S.clock=st.clock;
  if($('clock').textContent!==S.clock){$('clock').textContent=S.clock;fxRestart($('clock'),'ping')}
  $('chap').innerHTML=CH_LABEL[S.chap]+' · <b>'+S.chapName+'</b>';
  $('btnHint').disabled=!(st&&st.t==='puzzle');
  drawStatus();
  if(st&&st.t==='finale')audio.resolve();else{audio.unresolve();audio.setMood({1:.5,2:.65,3:.8,4:.95,5:.85}[S.chap]||.6)}
  stage.innerHTML='';
  if(!st)return;
  ({say:renderSay,ev:renderEv,choice:renderChoice,puzzle:renderPuzzle,rule:renderRule,cut:renderCut,end:renderEnd,finale:renderFinale})[st.t](st);
}
function dialogShell(who,label){
  const box=document.createElement('div');box.className='box dialog';box.tabIndex=0;box.setAttribute('role','button');
  const name=label||WHO[who];
  if(name){const w=document.createElement('div');w.className='who '+who;w.textContent=name;box.appendChild(w)}
  stage.appendChild(box);return box;
}
function typeInto(el,text,done){
  if(reduce){if(typing&&typing.cancel)typing.cancel();typing=null;el.textContent=text;done&&done();return}
  let k=0;el.textContent='';
  if(typing&&typing.cancel)typing.cancel();const me={cancel(){clearInterval(id)},finish(){clearInterval(id);el.textContent=text;if(typing===me)typing=null;done&&done()}};typing=me;
  const id=setInterval(()=>{k++;el.textContent=text.slice(0,k);if(k%2)audio.tk();if(k>=text.length)me.finish()},32);
}
function bindGo(box,go){box.onclick=go;box.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go()}};box.focus({preventScroll:true})}
function renderSay(st){
  const box=dialogShell(st.who,st.label);addPortrait(box,st);
  const line=document.createElement('div');line.className='line '+st.who;box.appendChild(line);
  const cont=document.createElement('div');cont.className='cont';cont.textContent='點一下繼續 ▸';cont.style.visibility='hidden';box.appendChild(cont);
  if(st.who==='voice')audio.whisper();
  if(st.fx==='flicker')fxFlicker();
  if(st.fx==='cut'){fxCut();audio.sting('death')}
  if(st.fx==='knock'){audio.knock();setTimeout(()=>audio.knock(),1400);fxBeat()}
  typeInto(line,st.text,()=>cont.style.visibility='visible');
  bindGo(box,()=>{if(typing){typing.finish();return}next()});
}
function renderEv(st){

  box.insertAdjacentHTML('beforeend','<div class="cont">點一下繼續 ▸</div>');

function renderChoice(st){
  const box=document.createElement('div');box.className='box dialog';box.style.cursor='default';
  box.innerHTML=`<div class="who me">${st.timer?'快！你要怎麼做？':'你要怎麼做？'}</div>${st.timer?`<div class="timer"><i style="animation-duration:${st.timer}s"></i></div>`:''}<div class="choices"></div>`;
  const c=box.querySelector('.choices');let done=false;
  const pick=o=>{if(done)return;done=true;clearTimers();S.ch[st.key]=o.v;S.chText[st.key]=o.text;
    if(o.die)return die(o.die);next()};
  st.options.forEach(o=>{const b=document.createElement('button');b.className='choice';b.textContent=o.text;b.onclick=()=>pick(o);c.appendChild(b)});
  stage.appendChild(box);
  if(st.timer){
    let beat=0;timers.push(setInterval(()=>{beat++;audio.thump(0,.25+beat*.01)},Math.max(380,900-st.timer*20)));
    timers.push(setTimeout(()=>{if(done)return;done=true;clearTimers();
      if(st.timeoutDie)return die(st.timeoutDie);
      const safe=st.options.find(o=>!o.die);S.ch[st.key]=safe.v;S.chText[st.key]=safe.text;
      stage.innerHTML='';const b2=dialogShell('narr');const l=document.createElement('div');l.className='line narr';l.textContent=st.timeoutSafe||'';b2.appendChild(l);
      b2.insertAdjacentHTML('beforeend','<div class="cont">點一下繼續 ▸</div>');bindGo(b2,next);
    },st.timer*1000));
  }
}
function renderRule(st){

  clearTimers();cineOff();
  const d=DEATHS[id];
  if(!DEX.includes(id)){DEX.push(id);saveDex()}
  S.deathsRun=(S.deathsRun||0)+1;
  audio.sting('death');fxRed();
  const rule=id==='exit'?'第 10 條：早上六點前，一定要離開旅社。':id==='mirror'?'第 7 條是假的。真正的守夜人，從沒叫你回頭。':`第 ${d.rule} 條：${RULES_INIT[d.rule-1].text}`;
  $('deathBody').innerHTML=`<div class="d-k">YOU BROKE THE RULES</div><h2>你沒有回去</h2><p></p><div class="d-rule"></div>
    <p class="cap" style="margin:0">死亡圖鑑 ${DEX.length} / ${Object.keys(DEATHS).length} · 新收錄「${d.t}」</p>
    <div class="row"><button class="btn danger" id="retry">從檢查點重來</button><button class="btn ghost" id="dRules">看須知</button></div>`;
  $('deathBody').querySelector('p').textContent=d.text;
  $('deathBody').querySelector('.d-rule').textContent=rule;
  const dv=$('death');dv.hidden=false;dv.style.animation='none';void dv.offsetWidth;dv.style.animation='';
  $('retry').onclick=retry;$('dRules').onclick=openRules;$('retry').focus();
}
function retry(){
  const deaths=S.deathsRun;const snap=S.snap;
  if(snap){S=JSON.parse(snap);S.snap=snap}
  S.deathsRun=deaths;save();
  $('death').hidden=true;$('sheet').hidden=true;render();
}

  el.innerHTML=`<div class="cp-grain"></div>
   <div class="cp-head"><div><div class="cp-k">${svgI('film')}SCENE SELECT</div><h3>選擇章節</h3><p>滑動挑一個場景，從那一刻開始。前面的線索會自動補上。</p></div><button class="cp-x" aria-label="關閉">${svgI('x')}</button></div>
   <div class="cp-rail">${list.map((c,i)=>card(c,i,list,cur)).join('')}</div>
   <div class="cp-chips">${list.map((c,i)=>`<button class="cp-chip${c.n===(cur||list[0].n)?' on':''}" data-i="${i}" aria-label="${CH_LABEL[c.n]}">${pad(c.n)}</button>`).join('')}</div>`;
  document.body.appendChild(el);open=el;
  const rail=el.querySelector('.cp-rail'),cards=[...el.querySelectorAll('.cp-card')],chips=[...el.querySelectorAll('.cp-chip')];
  const ci=cur?list.findIndex(c=>c.n===cur):0;
  if(ci>0)rail.scrollLeft=cards[ci].offsetLeft-16;
  cards.forEach((cd,i)=>{
    const b=cd.querySelector('.cp-gen b');
    if(reduceM){cd.classList.add('done');return}
    const t0=performance.now()+250+i*180;
    (function tick(t){const p=Math.max(0,Math.min(1,(t-t0)/1300));b.textContent=Math.round(p*100)+'%';if(p<1&&open===el)requestAnimationFrame(tick);else cd.classList.add('done')})(performance.now());
  });
  rail.addEventListener('scroll',()=>{const mid=rail.scrollLeft+rail.clientWidth/2;let best=0,d=1e9;cards.forEach((c,i)=>{const m=c.offsetLeft+c.offsetWidth/2;if(Math.abs(m-mid)<d){d=Math.abs(m-mid);best=i}});chips.forEach((c,i)=>c.classList.toggle('on',i===best))},{passive:true});
  el.addEventListener('click',e=>{
    if(e.target.closest('.cp-x'))return closePick();
    const ch=e.target.closest('.cp-chip');if(ch){cards[+ch.dataset.i].scrollIntoView({behavior:reduceM?'auto':'smooth',inline:'center',block:'nearest'});return}
    const go=e.target.closest('.cp-thumb,.cp-go');if(go)launch(+go.dataset.n,go.closest('.cp-card').querySelector('.cp-thumb'));
  });
  el.querySelector('.cp-x').focus({preventScroll:true});
}
function closePick(){if(!open)return;const el=open;open=null;el.classList.add('closing');setTimeout(()=>el.remove(),340)}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&open&&!busy)closePick()});
function finishJump(n){if(open){open.remove();open=null}busy=false;try{jumpTo(n)}catch(err){console.error(err)}}
function launch(n,thumb){
  if(busy)return;busy=true;
  const c=chapterList().find(x=>x.n===n);
  try{if(typeof audio!=='undefined'&&audio.init)audio.init()}catch(e){}
  if(reduceM){finishJump(n);return}
  const r=thumb.getBoundingClientRect();
  const fly=document.createElement('div');fly.className='cp-fly';
  fly.innerHTML=`<div class="cp-kb">${thumb.querySelector('.cp-kb').innerHTML}</div><div class="cp-rays"></div><div class="cp-scan"></div>`;
  Object.assign(fly.style,{left:r.left+'px',top:r.top+'px',width:r.width+'px',height:r.height+'px'});
  const ov=document.createElement('div');ov.className='cp-launch';
  ov.innerHTML=`<div class="cp-big"><small>${CH_LABEL[n]}</small><b>${c.name}</b></div><div class="cp-type"></div><div class="cp-bar"><i></i></div><canvas class="cp-burst"></canvas>`;
  document.body.append(fly,ov);open.classList.add('leaving');
  requestAnimationFrame(()=>requestAnimationFrame(()=>fly.classList.add('full')));
  const text=`> 生成場景：${CH_LABEL[n]}「${c.name}」 ${subOf(n)}`,ty=ov.querySelector('.cp-type');let k=0;
  const tyI=setInterval(()=>{k++;ty.innerHTML=text.slice(0,k).replace(/[&<>]/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;'})[s])+'<span class="cp-caret"></span>';if(k>=text.length)clearInterval(tyI)},Math.max(18,1000/text.length));
  const T=[setTimeout(()=>fly.classList.add('dive'),900),setTimeout(()=>ov.classList.add('reveal'),1050),setTimeout(()=>burst(ov.querySelector('.cp-burst')),1650),setTimeout(done,2150)];
  let finished=false;
  function done(){if(finished)return;finished=true;T.forEach(clearTimeout);clearInterval(tyI);finishJump(n);fly.classList.add('out');ov.classList.add('out');setTimeout(()=>{fly.remove();ov.remove()},600)}
  ov.addEventListener('click',done);
}
function burst(cv){
  const w=cv.width=innerWidth,h=cv.height=innerHeight,x=cv.getContext('2d');if(!x)return;
  const P=Array.from({length:220},()=>{const a=Math.random()*6.283,s=2+Math.random()*10;return {x:w/2,y:h*.45,vx:Math.cos(a)*s,vy:Math.sin(a)*s,r:1+Math.random()*2.6}});
  const t0=performance.now();
  (function f(t){const e=(t-t0)/700;x.clearRect(0,0,w,h);x.globalCompositeOperation='lighter';
    for(const p of P){p.x+=p.vx;p.y+=p.vy;p.vx*=.95;p.vy*=.95;x.globalAlpha=Math.max(0,1-e);x.fillStyle=Math.random()<.3?'#fff':ACC;x.beginPath();x.arc(p.x,p.y,p.r,0,6.283);x.fill()}
    if(e<1)requestAnimationFrame(f)})(t0);
}

/* ---------- bind ---------- */
window.cinePick=cinePick;
const b=document.getElementById('btnChap');if(b)b.onclick=cinePick;
const lab=document.getElementById('chap');if(lab){lab.onclick=cinePick;lab.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();cinePick()}}}
decorate();
new MutationObserver(sched).observe(document.body,{childList:true,subtree:true,characterData:true});
})();

/* ---------- episode deep link (#ch3) + resume audio on first tap ---------- */
(function(){
  const m=/^#ch(\d)$/.exec(location.hash||'');
  if(m&&typeof jumpTo==='function'){setTimeout(()=>{try{jumpTo(+m[1])}catch(e){}try{history.replaceState(null,'',location.pathname)}catch(e){}},60)}
  const wake=()=>{try{if(typeof audio!=='undefined'){if(!audio.ctx&&audio.init)audio.init();if(audio.ctx&&audio.ctx.state==='suspended')audio.ctx.resume()}}catch(e){}};
  document.addEventListener('pointerdown',wake,{capture:true});document.addEventListener('keydown',wake,{capture:true});
})();
