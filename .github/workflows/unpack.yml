name: Unpack uploaded project
on:
  push:
    paths:
      - 'upload/mixia.zip.part*'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project into repository root
        run: |
          ls -la upload
          cat upload/mixia.zip.part0* > /tmp/mixia.zip
          unzip -o -q /tmp/mixia.zip -d .
          git rm -q -r upload
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update Mixia project (unpacked from upload)"
          git push
